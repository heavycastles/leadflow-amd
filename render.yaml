# Render Blueprint — free-tier one-click demo (mock LLM, no GPU required).
# Deploy: https://dashboard.render.com/select-repo?type=blueprint
# Or: New → Blueprint → connect heavycastles/leadflow-amd → Apply.
services:
  - type: web
    name: leadflow-amd
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: LLM_BACKEND
        value: mock
      - key: LLM_FALLBACK
        value: "1"
      - key: LLM_HARDWARE
        value: "mock (Render free tier; live = AMD Token Factory key)"
      # Live AMD demo (optional): add secret AMD_TOKEN_FACTORY_API_KEY in the dashboard and remove
      # LLM_BACKEND / LLM_HARDWARE above — the key alone selects https://developer.amd.com.cn/radeon/api/v1.
      # Render injects PORT; serve.py reads it (default 8080).
